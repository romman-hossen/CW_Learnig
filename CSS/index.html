<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .div1,.div2,.div3{
            background-color: aqua;
            padding: 20px;
            /* margin: 24px; */
            position: absolute;

        }
        .div1{
            background-color: red;
            top: 0px;
            left: 0px;
            /* margin: 40px; */
        }
        .div2{
            background-color: green;
              top: 0px;
            right: 0px;
        }
        .div3{
            background-color: blue;
            bottom: 0;
            left: 0;
        }
        .div4{
            background-color: black;
            position: absolute;
            bottom: 0;
            right: 0;
            padding: 30px;
            color: rgba(255, 255, 255, 0.884);
        }
        .container{
            margin: 100px;
            background-color: rgb(204, 73, 25);
            height: 500px;
            position: relative;
        }
        #green {
            background-color: rgb(42, 168, 42);
            width: 600px;
            height: 300px;
            position: relative;
            top: 100px;
            left:500px;
           
        }
        #red{
            background-color: red;
            position: absolute;
            height: 200px;
            width: 200px;
            border-radius: 50%;
            bottom: 40px;
            left: 200px;
        }
    </style>
</head>
<body>
    <div class="container">      
        <div class="div1">div 1</div>
        <div class="div2">div 2</div>
        <div class="div3">div 3</div>
        <div class="div4">div 4</div>
        <div id="green">
            <div id="red">

            </div>
        </div>
    </div>
</body>
</html>
